name: CI

# Vercel despliega `main` a producción automáticamente en cada push. Este
# workflow es la puerta que hay delante: si tipos, lint, pruebas, build o las
# auditorías fallan, el check queda en rojo antes de fusionar.
#
# Para que sea una puerta de verdad y no un semáforo decorativo, hay que
# activar la protección de rama en GitHub:
#   Settings → Branches → Add rule → main
#     · Require status checks to pass before merging → «verificar»
#     · Require branches to be up to date before merging
# Sin eso, el check informa pero no impide fusionar.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Un push nuevo cancela la ejecución anterior de la misma rama: no tiene
# sentido gastar minutos validando un commit que ya está superado.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Tipos, lint, pruebas y auditorías
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          # Misma major que el entorno de desarrollo y que Vercel.
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        # `npm ci` respeta el lockfile exactamente. `npm install` podría
        # resolver versiones distintas de las que se han validado.
        run: npm ci

      - name: Comprobar tipos
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Pruebas
        # Cómputo de plazos administrativos y codificación del enlace de
        # reanudación. Es la parte del producto donde un error de un día cuesta
        # un expediente, así que se prueba antes de compilar nada.
        run: npm test

      - name: Contraste de los tokens de color
        # No necesita navegador ni servidor: lee globals.css y calcula. Va
        # antes del build porque es la comprobación más barata que existe y
        # atrapa una regresión de accesibilidad en dos segundos.
        run: npm run audit:contraste

      - name: Build de producción
        # Es la comprobación que más cosas atrapa: genera las páginas
        # estáticas de los ocho idiomas, así que un error en el contenido de un
        # trámite o en una combinación de SEO programático falla aquí y no en
        # producción.
        run: npm run build

      - name: Instalar Chromium para las auditorías de navegador
        run: npx playwright install --with-deps chromium

      - name: Levantar el servidor de producción
        # `npm start` sirve exactamente el mismo build que va a producción, no
        # el de desarrollo. Medir el de desarrollo no diría nada útil.
        # Cada auditoría espera por su cuenta a que el servidor responda
        # (`esperarServidor`), así que no hace falta añadir una dependencia
        # solo para esto.
        run: npm start -- --port 3000 &

      - name: Auditoría móvil
        # Desbordamiento horizontal y zonas táctiles a 360 y 390 px.
        run: npm run audit:movil

      - name: Auditoría de datos estructurados
        # Comprueba que el JSON-LD es válido, que cada tipo de página emite su
        # cobertura y que NO aparece marcado de valoraciones.
        run: npm run audit:jsonld

      - name: Auditoría del embudo
        # Verifica que la instrumentación registra el recorrido y que en el
        # registro no aparece ninguna respuesta del usuario.
        run: npm run audit:embudo
