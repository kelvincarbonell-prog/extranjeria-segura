name: CI

# Vercel despliega `main` a producción automáticamente en cada push. Este
# workflow es la puerta que hay delante: si tipos, lint o build fallan, el
# check queda en rojo antes de fusionar.
#
# Para que sea una puerta de verdad y no un semáforo decorativo, hay que
# activar la protección de rama en GitHub:
#   Settings → Branches → Add rule → main
#     · Require status checks to pass before merging → «verificar»
#     · Require branches to be up to date before merging
# Sin eso, el check informa pero no impide fusionar.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Un push nuevo cancela la ejecución anterior de la misma rama: no tiene
# sentido gastar minutos validando un commit que ya está superado.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Tipos, lint y build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          # Misma major que el entorno de desarrollo y que Vercel.
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        # `npm ci` respeta el lockfile exactamente. `npm install` podría
        # resolver versiones distintas de las que se han validado.
        run: npm ci

      - name: Comprobar tipos
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build de producción
        # Es la comprobación que más cosas atrapa: genera las 177 páginas
        # estáticas, así que un error en el contenido de un trámite o en una
        # combinación de SEO programático falla aquí y no en producción.
        run: npm run build
